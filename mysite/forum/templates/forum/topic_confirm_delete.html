{% extends "base.html" %}
{% block title %}Удаление темы{% endblock %}
{% block content %}
<div class="card">
  <h1>Удалить тему?</h1>
  <p>Ты действительно хочешь удалить тему "{{ topic.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Да, удалить</button>
    <a class="btn btn-primary" href="{% url 'forum_topic_detail' topic.pk %}">Отмена</a>
  </form>
</div>
{% endblock %}
